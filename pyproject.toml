[project]
name = "domain-checker"
version = "0.1.0"
description = "Check domain availability across all TLDs"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
domain-checker = "domain_checker.cli:main_sync"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
